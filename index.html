<!doctype html>
<meta charset="utf-8">
<title>Ouvrir la conversation Claude Code</title>
<script>
  // ?session=<uuid> (conversation CLI, VS Code ou application) ou local_<id> (session de l'application)
  const s = new URLSearchParams(location.search).get("session") || "";
  const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  const local = /^local_[A-Za-z0-9-]{1,64}$/;
  const target = uuid.test(s) ? "claude://resume?session=" + s
    : local.test(s) ? "claude://code/continue?session=" + s : null;
  if (target) {
    // L'onglet se ferme quand l'application prend la main (après l'éventuelle confirmation du navigateur)
    addEventListener("blur", () => window.close());
    location.href = target;
  }
  else document.write("Identifiant de conversation absent ou invalide.");
</script>
<p>Ouverture de la conversation dans l'application Claude…</p>
